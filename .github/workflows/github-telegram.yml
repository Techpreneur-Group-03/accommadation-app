name: Telegram GitHub Notification

on:
  push:
  pull_request:
  issues:
  issue_comment:
  pull_request_review:
  pull_request_review_comment:
  release:

jobs:
  notify:
    environment: Telegram Github Action
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name || 'N/A' }}
          EVENT: ${{ github.event_name }}
          USER: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
          EVENT_URL: ${{ github.event.head_commit.url || github.event.pull_request.html_url || github.event.issue.html_url || github.event.release.html_url || github.server_url }}
        run: |
          set -euo pipefail

          MESSAGE=$(printf '🔔 GitHub Activity\n\nRepository: %s\nBranch: %s\nEvent: %s\nUser: %s\nCommit message: %s\n\n%s' \
            "$REPOSITORY" \
            "$BRANCH" \
            "$EVENT" \
            "$USER" \
            "$COMMIT_MESSAGE" \
            "$EVENT_URL")

          curl --fail --silent --show-error -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "message_thread_id=${TELEGRAM_THREAD_ID}"
